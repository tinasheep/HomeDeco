<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>沖繩自駕四日</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--bg:#fdf6ea;--ink:#2d2a26;--card:#fffdf8;--sun:#f6d27a;--sea:#3fa3aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
form{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:28px 24px;width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
h1{margin:0;font-size:1.6rem;font-weight:400}
p{margin:0;font-size:.95rem}
input{font:inherit;font-size:1.05rem;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%}
button{font:inherit;font-size:1.05rem;padding:10px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.err{color:#b3402f;min-height:1.2em;font-size:.9rem}
label.rem{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.85rem}
label.rem input{width:auto}
</style>
</head>
<body>
<form id="f">
  <h1>🐋 沖繩自駕四日</h1>
  <p>請輸入密碼</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="密碼" autofocus>
  <label class="rem"><input type="checkbox" id="rem"> 在這台裝置記住密碼</label>
  <button type="submit">打開行程</button>
  <div class="err" id="err" role="alert"></div>
</form>

function u(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function open(pw){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
var KEY='okinawa2027-pw';

});
